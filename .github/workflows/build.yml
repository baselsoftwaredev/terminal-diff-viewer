name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and installer tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh -n install.sh
      - run: python3 scripts/test_install.py
      - run: sh -n scripts/release.sh
      - run: python3 scripts/test_release.py

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target "$TARGET"
          rustup default 1.90.0
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Test and build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
      - name: Smoke-test binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/tdv"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --demo --plain > demo.patch
          test -s demo.patch
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/package.py --target "$TARGET" --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package.py --target "$TARGET"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tdv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish downloadable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tdv-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum tdv-*.tar.gz tdv-*.zip > SHA256SUMS
      - name: Publish release after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            test "$(cat is-draft.txt)" = true || { echo 'Release already published; refusing to replace assets.' >&2; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --title "tdv $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* install.sh --clobber
          gh release edit "$TAG" --draft=false --latest
